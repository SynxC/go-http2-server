openapi: 3.0.3
info:
  title: Petstore API
  description: API for managing pets in a pet store
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
paths:
  /pets:
    post:
      summary: Create a new pet
      requestBody:
        description: Pet object that needs to be added to the store
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Pet created successfully
          headers:
            Location:
              description: URL of the newly created pet
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid input
  /pets/{petId}:
    get:
      summary: Get a pet by petId
      parameters:
        - name: petId
          in: path
          required: true
          description: ID of the pet to return
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
    delete:
      summary: Delete a pet by petId
      parameters:
        - name: petId
          in: path
          required: true
          description: ID of the pet to delete
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Pet deleted successfully
        '404':
          description: Pet not found
components:
  schemas:
    Pet:
      type: object
      required:
        - name
        - status
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          example: "Doggie"
        status:
          type: string
          description: Pet status in the store
          enum:
            - available
            - pending
            - sold
        category:
          type: string
          description: Category of the pet
          enum:
            - dog
            - cat
            - bird
            - fish
            - reptile
            - other
        tags:
          type: array
          description: Tags associated with the pet
          items:
            type: string
          example:
            - "friendly"
            - "energetic"
        age:
          type: integer
          description: Age of the pet in years
          example: 3
        color:
          type: string
          description: Color of the pet
          example: "Golden"
        gender:
          type: string
          description: Gender of the pet
          example: "male"
        weight:
          type: number
          format: float
          description: Weight of the pet in kilograms
          example: 25.5
        dateAdded:
          type: string
          format: date-time
          description: Date when the pet was added to the store
          example: "2023-01-20T08:30:00Z"
